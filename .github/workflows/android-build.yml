name: Build Deal Recon APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop/v3-communications

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip

      - name: Check V3 JavaScript
        run: |
          node --check app/src/main/assets/communications-v3.js
          node --check app/src/main/assets/ai-test.js
          node tests/communications-v3.test.js
          node tests/phone-recon-worker.test.mjs
          node tests/phone-recon-secure-client.test.mjs

      - name: Restore signing keystore
        run: echo "${{ secrets.DEALRECON_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/dealrecon-release.keystore"

      - name: Build APK
        env:
          DEALRECON_KEYSTORE_PATH: ${{ runner.temp }}/dealrecon-release.keystore
          DEALRECON_KEYSTORE_PASSWORD: ${{ secrets.DEALRECON_KEYSTORE_PASSWORD }}
          DEALRECON_KEY_ALIAS: ${{ secrets.DEALRECON_KEY_ALIAS }}
        run: ./gradle-8.11.1/bin/gradle assembleDebug --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Deal-Recon-APK
          path: app/build/outputs/apk/debug/app-debug.apk
