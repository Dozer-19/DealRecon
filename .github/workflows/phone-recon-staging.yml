name: Deploy Phone Recon V3 staging (lookups off)

on:
  workflow_dispatch:
  push:
    branches:
      - develop/v3-communications
    paths:
      - .github/workflows/phone-recon-staging.yml
      - phone-recon-worker/**
      - tests/phone-recon-worker.test.mjs

permissions:
  contents: read

jobs:
  staging:
    if: github.ref == 'refs/heads/develop/v3-communications'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout V3 branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Worker locally
        run: |
          node tests/phone-recon-worker.test.mjs
          node tests/phone-recon-secure-client.test.mjs
      - name: Confirm staging configuration cannot call provider
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('phone-recon-worker/wrangler.toml','utf8'); if (!/^name = \"deal-recon-phone-recon-v3\"$/m.test(s) || !/^LOOKUPS_ENABLED = \"false\"$/m.test(s) || !/^MAX_DAILY_LOOKUPS = \"0\"$/m.test(s) || !/^MAX_MONTHLY_LOOKUPS = \"0\"$/m.test(s)) process.exit(1)"
      - name: Deploy separate staging Worker
        working-directory: phone-recon-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_V3_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]
          npx --yes wrangler@4.137.0 deploy --config wrangler.toml
      - name: Verify staging rejects unauthenticated requests
        run: |
          set -euo pipefail
          url='https://deal-recon-phone-recon-v3.dealrecon.workers.dev/'
          for attempt in 1 2 3 4 5; do
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/get.json" --write-out '%{http_code}' --max-time 10 "$url") || status=000
            if [[ "$status" == 405 ]]; then break; fi
            sleep 2
          done
          test "$status" = 405
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/post.json" --write-out '%{http_code}' --max-time 10 \
            --request POST --header 'Content-Type: application/json' \
            --data '{"owner":"Test Owner","propertyAddress":"123 Test St"}' "$url")
          test "$status" = 401
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/get.json'));const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/post.json'));if(a.ok!==false||b.ok!==false||b.error!=='Sign in required')process.exit(1)"
          echo 'Staging Worker rejects GET and unsigned contact requests as expected.'
