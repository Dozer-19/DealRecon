name: Deploy campaign review V3 staging (outreach disabled)

on:
  workflow_dispatch:
  push:
    branches:
      - develop/v3-communications
    paths:
      - .github/workflows/campaign-review-staging.yml
      - communications-worker/**
      - communications-engine/**

permissions:
  contents: read

concurrency:
  group: campaign-review-staging
  cancel-in-progress: false

jobs:
  staging:
    if: github.ref == 'refs/heads/develop/v3-communications'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout V3
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test campaign review
        run: |
          node tests/pilot-plan.test.mjs
          node tests/campaign-control.test.mjs
          node tests/campaign-worker.test.mjs
          node tests/campaign-review-client.test.cjs
          node tests/campaign-review-ui.test.cjs
      - name: Verify separate deployment target
        run: |
          node --input-type=module -e "import fs from 'node:fs';const s=fs.readFileSync('communications-worker/wrangler.toml','utf8');if(!/^name = \"deal-recon-campaigns-v3\"$/m.test(s))process.exit(1)"
      - name: Deploy review-only staging
        working-directory: communications-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_V3_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]
          npx --yes wrangler@4.137.0 deploy --config wrangler.toml
      - name: Verify unsigned reviews rejected
        run: |
          set -euo pipefail
          url='https://deal-recon-campaigns-v3.dealrecon.workers.dev/status'
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/response.json" --write-out '%{http_code}' --max-time 20 --request POST --header 'Content-Type: application/json' --data '{}' "$url")
          test "$status" = 401
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/response.json'));if(r.error!=='Sign in required')process.exit(1)"
